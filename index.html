<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deployment Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      max-width: 480px;
      width: 90%;
    }
    .check {
      font-size: 64px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: .5rem;
    }
    p {
      color: #6e6e73;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      background: #d1fae5;
      color: #065f46;
      padding: .3rem .9rem;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .meta {
      margin-top: 2rem;
      font-size: 12px;
      color: #aeaeb2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>Deployment works!</h1>
    <p>This page was deployed automatically via Auto Deploy. If you can read this, the pipeline is working correctly.</p>
    <span class="badge">Status: Live</span>
    <div class="meta">
      Deployed at: <span id="ts"></span>
    </div>
  </div>
  <script>
    document.getElementById("ts").textContent = new Date().toUTCString();
  </script>
</body>
</html>
