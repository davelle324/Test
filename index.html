<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Deploy — Test Site</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      max-width: 480px;
      width: 90%;
    }
    .check { font-size: 64px; margin-bottom: 1rem; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: .5rem;
    }
    p {
      color: #6e6e73;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .platforms {
      display: flex;
      justify-content: center;
      gap: .75rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
    }
    .platform {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: .35rem .85rem;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .meta {
      font-size: 12px;
      color: #aeaeb2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>Deployment works!</h1>
    <p>This page is deployed via Auto Deploy. If you can read this, the pipeline is working correctly for this platform.</p>
    <div class="platforms">
      <span class="platform">▲ Vercel</span>
      <span class="platform">⬛ Render</span>
      <span class="platform">◆ Netlify</span>
    </div>
    <div class="meta">Deployed at: <span id="ts"></span></div>
  </div>
  <script>
    document.getElementById("ts").textContent = new Date().toUTCString();
  </script>
</body>
</html>
